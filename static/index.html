<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Record and Share</title>
    <link rel="stylesheet" href="/static/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-left">
            <a href="/" class="brand">Lumina</a>
        </div>
        <div class="header-right">
            <div id="user-profile" class="user-profile" style="display: none;">
                <span id="user-name" class="user-name"></span>
                <button id="logout-btn" class="btn secondary small logout-btn">Logout</button>
            </div>
            <div id="timer" class="timer">00:00</div>
            <div id="recording-status" class="status-badge recording">Recording</div>
        </div>
    </header>

    <main class="container">
        <div class="recorder-card">
            <div class="video-preview-wrapper">
                <video id="preview" autoplay muted playsinline></video>
                <div id="placeholder" class="placeholder">
                    <div class="placeholder-icon">🎥</div>
                    <h2>Ready to record?</h2>
                    <p>Share your screen to start capturing with Lumina.</p>
                </div>
            </div>

            <div class="webcam-toggle-wrapper">
                <label class="webcam-toggle">
                    <input type="checkbox" id="webcam-enabled">
                    <span class="toggle-label">📹 Include Webcam</span>
                </label>
            </div>

            <div class="controls-bar">
                <button id="start-btn" class="btn primary">
                    <span>Start Recording</span>
                </button>
                <button id="pause-btn" class="btn secondary" disabled>
                    <span>Pause</span>
                </button>
                <button id="resume-btn" class="btn secondary" style="display: none;">
                    <span>Resume</span>
                </button>
                <button id="stop-btn" class="btn danger" disabled>
                    <span>Stop Recording</span>
                </button>
            </div>
            <canvas id="composite-canvas" style="display: none;"></canvas>
        </div>

        <div id="share-section" class="share-section">
            <div class="share-header">
                <h3>Video Ready!</h3>
                <p>Your recording is uploaded and ready to share.</p>
            </div>
            <div class="video-name-wrapper">
                <div class="edit-wrapper">
                    <input type="text" id="video-name-input" placeholder="Give your video a name...">
                    <span id="extension-suffix-ready" class="extension-suffix"></span>
                </div>
                <button id="save-name-btn" class="btn secondary small">Rename</button>
            </div>
            <div class="share-url-wrapper">
                <input type="text" id="share-url" readonly>
                <button id="copy-btn" class="btn primary">Copy Link</button>
            </div>
        </div>

        <section class="history-section">
            <div class="section-header">
                <h2>Recent Recordings</h2>
                <button id="refresh-history" class="btn secondary small">Refresh</button>
            </div>
            <div id="history-list" class="history-grid">
                <!-- History items will be injected here -->
                <div class="loading-state">Loading your recordings...</div>
            </div>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>

</html>
