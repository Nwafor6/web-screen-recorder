<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Login / Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-container">
        <header class="auth-header">
            <a href="/" class="brand">Lumina</a>
            <p>Capture and share your ideas instantly.</p>
        </header>

        <div class="auth-card">
            <div class="auth-tabs">
                <button id="login-tab" class="active">Login</button>
                <button id="register-tab">Register</button>
            </div>

            <form id="auth-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" id="submit-btn" class="btn primary full-width">Login</button>
            </form>
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script>
        const authForm = document.getElementById('auth-form');
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const submitBtn = document.getElementById('submit-btn');
        const authMessage = document.getElementById('auth-message');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        let mode = 'login';

        loginTab.addEventListener('click', () => {
            mode = 'login';
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            submitBtn.textContent = 'Login';
            authMessage.textContent = '';
        });

        registerTab.addEventListener('click', () => {
            mode = 'register';
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            submitBtn.textContent = 'Register';
            authMessage.textContent = '';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value;
            const password = passwordInput.value;
            authMessage.textContent = 'Processing...';

            try {
                if (mode === 'login') {
                    const params = new URLSearchParams();
                    params.append('username', username);
                    params.append('password', password);

                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: params
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('token', data.access_token);
                        window.location.href = '/';
                    } else {
                        const err = await response.json();
                        authMessage.textContent = err.detail || 'Login failed';
                        authMessage.className = 'auth-message error';
                    }
                } else {
                    const response = await fetch(`/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
                        method: 'POST'
                    });

                    if (response.ok) {
                        authMessage.textContent = 'Registration successful! You can now login.';
                        authMessage.className = 'auth-message success';
                        mode = 'login';
                        loginTab.click();
                    } else {
                        const err = await response.json();
                        authMessage.textContent = err.detail || 'Registration failed';
                        authMessage.className = 'auth-message error';
                    }
                }
            } catch (err) {
                console.error(err);
                authMessage.textContent = 'An error occurred.';
                authMessage.className = 'auth-message error';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>

</html>
